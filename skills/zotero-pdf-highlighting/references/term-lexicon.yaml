# 五色判色种子簇（classify_color.py 用；方法色直接复用上面的 method_seeds）
# 取材依据 zotero-paper-note 五章节定义：红=研究对象世界的扰动/现象/问题，
# 黄=模型里的专指成本项/约束/结构名，蓝=真实案例专名与真实数据场景，
# 紫=实验发现的量与结论短语。每簇 10-15 个代表词，改后自动重算质心缓存。
# 原则：只收"专指"词（unmet demand cost），不收泛化建模词（objective
# function / decision variable / constraint 是过滤层灰区词，收进来会把
# 灰区词错判成黄色）。
rq_seeds:         # 🔴 红：研究问题——研究对象系统的扰动来源/现象/问题
  - supply chain resilience
  - network resilience
  - disruption risk
  - facility disruption
  - demand uncertainty
  - risk propagation
  - network robustness
  - recovery strategy
  - port congestion
  - carbon emission
  - last-mile delivery
  - relief supplies
  - capacity expansion
  - 中断风险
  - 需求不确定性
  - 风险传播
  - 韧性评估
  - 碳排放
  - 末端配送
model_seeds:      # 🟡 黄：数学模型——专指的成本项/约束/结构名
